name: build

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/AccessDoor.Core.Tests

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build src/AccessDoor.Desktop -c Release

  mobile-android:
    # Linux runners start faster and cost less than Windows for the Android build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      # iOS cannot be restored on Linux, so build only the Android target.
      - run: dotnet build src/AccessDoor.Mobile -f net10.0-android -c Release -p:MobileTargetFrameworks=net10.0-android

  mobile-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios
      # Debug builds target the iOS simulator, so no signing certificate is needed.
      # Build only the iOS target so restore does not also require the Android workload.
      - run: dotnet build src/AccessDoor.Mobile -f net10.0-ios -c Debug -p:MobileTargetFrameworks=net10.0-ios
