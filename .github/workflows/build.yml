name: build

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/AccessDoor.Core.Tests

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/AccessDoor.Desktop -c Release

  mobile-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/AccessDoor.Mobile -f net10.0-android -c Release

  mobile-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios
      # Debug builds target the iOS simulator, so no signing certificate is needed.
      # Restrict TargetFrameworks so restore does not also require the Android workload.
      - run: dotnet build src/AccessDoor.Mobile -f net10.0-ios -c Debug -p:TargetFrameworks=net10.0-ios
