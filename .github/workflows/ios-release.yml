name: ios-release

# Signed App Store / Ad Hoc build of the iOS app. Runs on version tags (v1.2.3) or manually.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   IOS_CERTIFICATE_P12_BASE64      base64 of the distribution certificate exported as .p12
#   IOS_CERTIFICATE_PASSWORD        password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 base64 of the .mobileprovision for com.companyname.AccessDoor
#   IOS_CODESIGN_KEY                certificate name, e.g. "Apple Distribution: Company (TEAMID1234)"
# Create the base64 values with:  base64 -i file.p12 | pbcopy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios-release:
    runs-on: macos-latest
    steps:
      - name: Check signing secrets
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          for name in P12 P12_PASSWORD PROFILE CODESIGN_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing iOS signing secret for $name. See the header of .github/workflows/ios-release.yml."
              exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-ios

      - name: Install certificate and provisioning profile
        id: signing
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "profile-name=$name" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build signed IPA
        env:
          CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
        run: >
          dotnet publish src/AccessDoor.Mobile
          -f net10.0-ios -c Release
          -p:MobileTargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$PROFILE_NAME"
          -o "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: AccessDoor-ios-${{ github.ref_name }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
